name: Verify site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Syntax check
        run: |
          node --check src/app.js
          node --check src/data/works.js
          node --check src/data/details-fanhua.js
          node --check src/data/details-public.js

      - run: npm run validate:assets
      - run: npm run build:pages
      - run: npm run verify:pages-site

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start test server
        run: |
          node scripts/test_server.mjs > /tmp/fanhuafenluo-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fanhuafenluo-http.log || true
          exit 1

      - name: Chromium regression
        env:
          TEST_URL: http://127.0.0.1:4173
        run: npm test -- --project=chromium

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
